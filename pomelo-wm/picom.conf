# Pomelo 的 picom 設定（視窗陰影與淡入淡出）
# 「外觀 → 視窗陰影與動畫」打開時，pomelo（視窗管理器）會用這個設定啟動 picom。
# 想自己調整：複製到 ~/.config/pomelo/picom.conf 再改，下次打開時就會用你的。
# 只用 picom 9 以後都認得的選項（Ubuntu 22.04 是 9.1）。

backend = "xrender";      # 沒有 3D 加速的電腦、虛擬機也能用
vsync = false;
use-damage = true;
unredir-if-possible = true;   # 全螢幕的影片、遊戲直接畫，不經過合成

# 陰影：柔和、往下偏一點
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.42;
shadow-offset-x = -22;
shadow-offset-y = -16;
shadow-exclude = [
	"window_type = 'dock'",          # 選單列、Dock、小柚
	"window_type = 'desktop'",
	"window_type = 'dnd'",           # 拖曳中的圖示
	"class_g = 'pomelo-assistant' && override_redirect = true",
	"_GTK_FRAME_EXTENTS@:c",         # 自己畫陰影的 GTK 視窗
	"class_g = 'firefox' && argb",
	"class_g = 'Firefox' && argb"
];

# 淡入淡出：開關視窗、選單時大約 0.15 秒
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.08;
fade-delta = 10;
fade-exclude = [
	"class_g = 'pomelo-assistant'",
	"window_type = 'dnd'"
];

# 不同種類的視窗
wintypes:
{
	tooltip = { fade = true; shadow = true; opacity = 1; focus = true; };
	popup_menu = { shadow = true; opacity = 1; };
	dropdown_menu = { shadow = true; opacity = 1; };
	notification = { shadow = true; };
	dock = { shadow = false; };
	dnd = { shadow = false; fade = false; };
};

# 圓角：跟 Pomelo 的視窗外框一樣（陰影也會跟著是圓角，不會在角落留下缺口）
corner-radius = 10;
rounded-corners-exclude = [
	"window_type = 'dock'",
	"window_type = 'dnd'",
	"window_type = 'tooltip'",
	"window_type = 'popup_menu'",
	"window_type = 'dropdown_menu'",
	"window_type = 'notification'",
	"class_g = 'pomelo-assistant'"
];

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
