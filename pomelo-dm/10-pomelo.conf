# Pomelo 的 Xorg 最小化設定（裝在 /usr/share/X11/xorg.conf.d/，所有 Xorg 開機時都會自動讀取，
# 不限於 pomelo-dm 啟動的那個——pomelo-dm 現在已經改成啟動 pomelo-compositor、不會自己跑 Xorg
# 了，但透過 GDM3／LightDM 之類別的登入管理員選 Pomelo session 時，走的還是這份設定）。
# 目的：跳過不需要的硬體探測與模組載入，縮短啟動 X 的時間。
# 沒有寫在這裡的部分（顯示卡型號、解析度）照舊自動偵測，不影響相容性。
#
# 教訓：這裡原本還有一行 `Option "AutoAddDevices" "false"`，當初以為是「只用 libinput、
# 不要再試舊版 kbd/mouse/evdev 驅動」的意思，其實完全理解錯了——AutoAddDevices 關掉以後
# Xorg 根本不會自動加入任何 udev 偵測到的裝置（不分新舊驅動），下面這段 InputClass 規則
# 也就永遠沒有機會被套用，整個 X session 會變成完全沒有可用的鍵盤滑鼠。
# 跳過驅動探測的正確做法本來就只需要這段 InputClass，不要再加 AutoAddDevices。

Section "ServerFlags"
	# 系統只有一張顯示卡時，省掉開機再去找「有沒有第二張」的那次探測
	Option "AutoAddGPU" "false"
	# 不用 X 的螢幕保護／DPMS 計時器，閒置鎖定交給 pomelo-power 處理
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
	Option "BlankTime" "0"
EndSection

# 明確指定輸入裝置用 libinput，跳過 Xorg 預設會做的「每種協定都試一遍」
Section "InputClass"
	Identifier "pomelo-libinput"
	MatchIsKeyboard "true"
	MatchIsPointer "true"
	MatchIsTouchpad "true"
	MatchIsTouchscreen "true"
	Driver "libinput"
EndSection

# 用不到的擴充功能：dbe（雙重緩衝，cairo／picom 都不靠它）、
# record（輸入事件側錄，pomelo 沒有程式用它）、security（X 安全延伸，單人工作階段用不到）
Section "Module"
	Disable "dbe"
	Disable "record"
	Disable "security"
EndSection
