# Pomelo 登入管理員（pomelo-dm）設定。改完下次登出或重新開機生效。
#
# 開機自動登入（不問密碼）：填使用者名稱；留空 = 顯示登入畫面
autologin-user=
# 自動登入用的工作階段（/usr/share/xsessions 裡的檔名，不含 .desktop）；留空 = default-session
autologin-session=
# 沒有記錄時預設的工作階段
default-session=pomelo
# 不要出現在登入畫面的帳號，用逗號分開，例如 backup,test
hide-users=
# 顯示「其他使用者」（手動輸入帳號名稱）：true / false
show-other-user=false
# pomelo-compositor 跑在第幾個 VT（Ctrl+Alt+F3 等可以切到文字登入）；啟動前會先切過去，登記給 logind 的也是這個
vt=7
# 自訂 compositor 指令（通常不用改；留空＝用 PATH 裡的 pomelo-compositor）
compositor=
# ---- 登入畫面的外觀（系統設定 → 登入畫面 也可以改）----
# 背景：user = 使用者上次用的桌布、image = 管理員指定的圖片（/var/lib/pomelo-dm/background）、gradient = 內建漸層
background=user
# 時鐘：24h、12h、off（不顯示）
clock=24h
# 文字大小：normal、large
text-size=normal
# 顯示使用者清單（頭像）；false = 只顯示「名稱與密碼」欄位，要自己輸入帳號
user-list=true
# 顯示睡眠、重新開機、關機按鈕
power-buttons=true
# 顯示在登入畫面上的訊息（例如「撿到這台電腦請聯絡 …」），留空 = 不顯示
message=
